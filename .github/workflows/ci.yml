name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Validate generated manifest schema
        run: npm run validate:manifest-schema

      - name: Validate Codex plugin
        run: npm run validate:plugin

      - name: Validate Claude plugin and marketplace
        run: npm run validate:claude-plugin

  portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test core
        run: npm run test -w @ai-marketplace/core
      - name: Test shared Node CLI
        run: npm run test -w @ai-marketplace/node-cli
      - name: Test Codex plugin
        run: npm run test -w @ai-marketplace/codex-plugin
      - name: Test Claude plugin
        run: npm run test -w @ai-marketplace/claude-plugin
