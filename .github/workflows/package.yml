name: Release interfaces

on:
  push:
    tags:
      - "vscode-v*"
      - "codex-v*"
      - "claude-v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:tag-version -- "${{ github.ref_name }}"
      - run: npm run validate:release-versions
      - run: npm run lint
      - run: npm test
      - run: npm run compile
      - run: npm run validate:manifest-schema
      - run: npm run validate:plugin
      - run: npm run validate:claude-plugin

  publish-vscode-marketplace:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: npm ci
      - run: npm run package:vscode
      - run: npm exec -- vsce publish --packagePath dist/*.vsix --azure-credential

  publish-open-vsx:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:vscode
      - run: npm exec -- ovsx publish dist/*.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  release-vscode:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [publish-vscode-marketplace, publish-open-vsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:vscode
      - run: sha256sum dist/*.vsix > dist/SHA256SUMS
      - run: gh release create "${{ github.ref_name }}" dist/*.vsix dist/SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  release-codex:
    if: startsWith(github.ref, 'refs/tags/codex-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:codex
      - run: sha256sum dist/*.tgz > dist/SHA256SUMS
      - run: gh release create "${{ github.ref_name }}" dist/*.tgz dist/SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  release-claude:
    if: startsWith(github.ref, 'refs/tags/claude-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:claude
      - run: sha256sum dist/*.tgz > dist/SHA256SUMS
      - run: gh release create "${{ github.ref_name }}" dist/*.tgz dist/SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
